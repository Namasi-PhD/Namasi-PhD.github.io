<!-- Scroll-reveal animations for page content -->
<script>
(function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!('IntersectionObserver' in window)) return;

    var targets = document.querySelectorAll(
        '.page__content > h2, .page__content > h3, .page__content > p, ' +
        '.page__content > ul > li, .page__content > ol > li, ' +
        '.page__content > img, .page__content > blockquote, ' +
        '.archive__item, .list__item'
    );
    if (!targets.length) return;

    var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

    targets.forEach(function (el, i) {
        el.classList.add('reveal');
        el.style.transitionDelay = (Math.min(i, 6) * 0.05) + 's';
        observer.observe(el);
    });
})();
</script>
